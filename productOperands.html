<!DOCTYPE html> 
<html>
<title>Finding operands for product-HitKu</title> 
<head> 
<script> 
function productOprnds() {
let hit=0,ku=0,d,j,hitO=1,kuO=1;
let dispMsg="HitKu: ";
let prodInput=document.getElementById("productInput");
j=Number(prodInput.value);
document.getElementById('calcBtn').toggleAttribute('disabled');
d=j;
while(j>0){
hit++;
j-=hitO;
hitO+=2;
}
while(j<0){	
ku++;
j+=kuO;
kuO+=2;
while(j>0){
hit++;
j-=hitO;
hitO+=2;
}
}
dispMsg+="Multiplier = "+(hit+ku)+",Multiplicand = "+(hit-ku);
document.getElementById('calcBtn').toggleAttribute('disabled');
 document.getElementById("result").innerHTML = dispMsg; 
dispMsg="";
      } 
   </script>
</head>
<body>
 <br><br>Product operands
<br><br>
Product : <input type="number" id="productInput" placeholder="Enter Product">
 <br><br>
   <button  id="calcBtn" onclick = "productOprnds()"> Find Operands </button>  
  <p> 
   <div id = "result1"> </div> <br> 
<div id = "result"> </div> 
   </p> 
</body> 
</html>
